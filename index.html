<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Wave</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 20px 40px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .language-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .language-links a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .language-links a:hover {
            background-color: #2980b9;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 20px 10px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Circle Wave</h1>
        <p>Please select your language to view the Privacy Policy:</p>
        <div class="language-links">
            <a href="privacy_policy_en.html">English</a>
            <a href="privacy_policy_pl.html">Polski</a>
            <a href="privacy_policy_de.html">Deutsch</a>
            <a href="privacy_policy_fr.html">Français</a>
            <a href="privacy_policy_es.html">Español</a>
        </div>
    </div>
</body>
</html>
